name: Build desktop applications

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: windows-11-arm
            artifact: windows-arm64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-15
            artifact: macos-arm64
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0

      - name: Build OpenSSL for Windows ARM64
        if: matrix.artifact == 'windows-arm64'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $root
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          & "$root\vcpkg.exe" install openssl:arm64-windows-static-md
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKGRS_TRIPLET=arm64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=arm64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev,build]"

      - name: Test
        run: |
          python -m ruff check src tests
          python -m pytest -q

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean packaging/zha-quirk-builder.spec

      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "dist/ZHA Quirk Builder.exe" --self-test; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'

      - name: Smoke test macOS application
        if: runner.os == 'macOS'
        run: '"dist/ZHA Quirk Builder.app/Contents/MacOS/ZHA Quirk Builder" --self-test'

      - name: Smoke test Linux executable
        if: runner.os == 'Linux'
        run: '"dist/ZHA Quirk Builder" --self-test'

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/ZHA Quirk Builder.exe" -DestinationPath "ZHA-Quirk-Builder-${{ matrix.artifact }}.zip"

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/ZHA Quirk Builder.app" "ZHA-Quirk-Builder-${{ matrix.artifact }}.zip"

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: tar -czf "ZHA-Quirk-Builder-${{ matrix.artifact }}.tar.gz" -C dist "ZHA Quirk Builder"

      - uses: actions/upload-artifact@v4
        with:
          name: ZHA-Quirk-Builder-${{ matrix.artifact }}
          path: |
            ZHA-Quirk-Builder-*.zip
            ZHA-Quirk-Builder-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
