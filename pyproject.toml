[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zha-quirk-builder"
version = "0.1.0"
description = "Standalone visual builder and compatibility validator for ZHA QuirkBuilder v2 files"
requires-python = ">=3.12"
dependencies = [
  "PySide6==6.11.2",
  "cryptography>=44,<50",
  "uv==0.10.2",
  "zigpy>=2.1,<2.2",
  "zha>=2.2,<2.3",
  "zha-quirks>=2.2,<2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.12,<1",
]
build = [
  "pyinstaller>=6.15,<7",
]

[project.scripts]
zha-quirk-builder = "zha_quirk_builder.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zha_quirk_builder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
